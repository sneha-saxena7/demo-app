<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ServiceFlow ERP</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;background:#f3f6fb;color:#18243a}header{background:#172e50;color:white;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header h1{margin:0;font-size:22px}header small{color:#c8d6ea}.layout{display:flex;min-height:calc(100vh - 72px)}nav{background:#203b60;padding:15px;width:220px;flex-shrink:0}nav button{display:block;width:100%;text-align:left;padding:12px;margin:3px 0;background:transparent;color:white;border:0;border-radius:8px;cursor:pointer}nav button.active,nav button:hover{background:#365982}main{padding:24px;flex:1;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}h2{margin:0 0 8px}p{color:#66748a}.btn{padding:10px 13px;border:1px solid #d6deea;background:white;border-radius:8px;cursor:pointer;font-weight:600}.primary{background:#2563eb;color:white;border-color:#2563eb}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:13px;margin:16px 0}.card{background:white;border:1px solid #e1e7f0;border-radius:12px;padding:17px;margin-bottom:16px}.metric{font-size:25px;font-weight:bold;margin:10px 0}.muted{font-size:12px;color:#68768b}.notice{background:#eaf2ff;padding:12px;border-radius:9px;color:#244c86;margin-bottom:15px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar input{padding:10px;border:1px solid #d6deea;border-radius:8px;flex:1;min-width:180px}table{border-collapse:collapse;width:100%;background:white}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f5;font-size:13px}th{background:#f8fafc;color:#657187;text-transform:uppercase;font-size:11px}.tablewrap{overflow:auto}.status{display:inline-block;padding:4px 8px;border-radius:20px;background:#e7f7ef;color:#17734d;font-size:11px;font-weight:bold}.low{background:#ffebeb;color:#b42318}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.dialog{background:white;border-radius:12px;padding:22px;width:min(540px,100%);max-height:90vh;overflow:auto}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:bold}.field input,.field select{padding:10px;border:1px solid #d6deea;border-radius:7px;width:100%}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.bar{display:inline-block;background:#7daaf7;border-radius:5px 5px 0 0;width:25px;margin:0 9px}.chart{height:150px;display:flex;align-items:end;border-bottom:1px solid #ddd;justify-content:center}.foot{font-size:12px;color:#69778b;margin-top:20px}@media(max-width:650px){.layout{display:block}nav{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:3px}nav button{margin:0}main{padding:14px}.fields{grid-template-columns:1fr}header{padding:16px}}
</style></head><body>
<header><div><h1>ServiceFlow ERP</h1><small>Integrated business management workspace</small></div><div>Administrator · Demo</div></header>
<div class="layout"><nav id="nav">
<button class="active" data-page="Dashboard">▦ Dashboard</button><button data-page="Inventory">▣ Inventory</button><button data-page="Orders">🛒 Sales & Purchasing</button><button data-page="HR">♙ Human Resources</button><button data-page="Finance">₹ Finance</button><button data-page="CRM">♧ CRM</button><button data-page="Reports">▥ Reports & Analytics</button>
</nav><main id="app"></main></div>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Add record</h2><form id="form"><div class="fields" id="fields"></div><div class="actions"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">Save record</button></div></form></div></div>
<script>
const initial={Inventory:[{id:"MAT-001",name:"A4 Paper Ream",category:"Office Supplies",qty:85,reorder:20,unit:"ream",cost:280},{id:"IT-002",name:"Wireless Mouse",category:"IT Equipment",qty:12,reorder:10,unit:"pcs",cost:650},{id:"IT-003",name:"USB-C Adapter",category:"IT Equipment",qty:7,reorder:10,unit:"pcs",cost:900}],Orders:[{id:"PO-001",type:"Purchase Order",party:"OfficeMart Supplies",date:"2026-10-12",amount:14000,status:"Pending"},{id:"SO-002",type:"Sales Order",party:"Northstar Consulting",date:"2026-10-13",amount:42500,status:"Approved"}],HR:[{id:"EMP-001",name:"Aarav Mehta",department:"Operations",role:"Operations Executive",email:"aarav@example.com",status:"Active"},{id:"EMP-002",name:"Priya Sharma",department:"Finance",role:"Finance Associate",email:"priya@example.com",status:"Active"}],Finance:[{id:"FIN-001",date:"2026-10-03",type:"Income",description:"Consulting services",amount:125000},{id:"FIN-002",date:"2026-10-07",type:"Expense",description:"Office rent",amount:35000}],CRM:[{id:"CUS-001",name:"Northstar Consulting",contact:"Ritika Verma",email:"ritika@example.com",stage:"Customer",value:125000},{id:"CUS-002",name:"BluePeak Solutions",contact:"Manish Khanna",email:"manish@example.com",stage:"Qualified",value:80000}]};
let data;try{data=JSON.parse(localStorage.getItem("sf_erp_data"))||JSON.parse(JSON.stringify(initial))}catch(e){data=JSON.parse(JSON.stringify(initial))}
let page="Dashboard",q="";const $=s=>document.querySelector(s),money=n=>"₹"+Number(n||0).toLocaleString("en-IN"),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){try{localStorage.setItem("sf_erp_data",JSON.stringify(data))}catch(e){}}
function status(s,low=false){return `<span class="status ${low?'low':''}">${esc(s)}</span>`}
function card(title,val,note){return `<div class="card"><div class="muted">${title}</div><div class="metric">${val}</div><div class="muted">${note}</div></div>`}
function table(headers,rows){return `<div class="tablewrap card"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}">No records found.</td></tr>`}</tbody></table></div>`}
function toolbar(placeholder,label){return `<div class="toolbar"><input id="search" placeholder="${placeholder}" value="${esc(q)}"><button class="btn primary" id="add">＋ ${label}</button></div>`}
function render(){
let html="";
if(page==="Dashboard"){let inv=data.Inventory.reduce((a,x)=>a+x.qty*x.cost,0),low=data.Inventory.filter(x=>x.qty<=x.reorder).length,inc=data.Finance.filter(x=>x.type==="Income").reduce((a,x)=>a+x.amount,0),exp=data.Finance.filter(x=>x.type==="Expense").reduce((a,x)=>a+x.amount,0);
html=`<div class="top"><div><h2>Business dashboard</h2><p>Overview of your services business.</p></div><button class="btn" onclick="exportData()">Export data</button></div><div class="notice"><b>Demo prototype:</b> Sample data only. Not connected to SAP or a live accounting system.</div><div class="cards">${card("Inventory value",money(inv),"Estimated from sample item costs")}${card("Items to reorder",low,"At or below reorder level")}${card("Recorded income",money(inc),"Sample transactions")}${card("Recorded expenses",money(exp),"Sample transactions")}</div><div class="card"><h3>Inventory watchlist</h3>${table(["Material","Category","Available","Reorder level","Status"],data.Inventory.filter(x=>x.qty<=x.reorder).map(x=>`<tr><td>${esc(x.name)}<div class="muted">${esc(x.id)}</div></td><td>${esc(x.category)}</td><td>${x.qty} ${esc(x.unit)}</td><td>${x.reorder}</td><td>${status("Low stock",true)}</td></tr>`).join(""))}</div>`}
else if(page==="Inventory"){let a=data.Inventory.filter(x=>Object.values(x).join(" ").toLowerCase().includes(q.toLowerCase()));html=`<div class="top"><div><h2>Inventory Management</h2><p>Track supplies, equipment, quantities and reorder levels.</p></div></div><div class="notice">SAP target: material master, stock overview, goods movements and procurement apps.</div>${toolbar("Search material or category","Add material")}${table(["ID","Description","Category","Quantity","Reorder","Unit cost","Status","Action"],a.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.name)}</td><td>${esc(x.category)}</td><td>${x.qty} ${esc(x.unit)}</td><td>${x.reorder}</td><td>${money(x.cost)}</td><td>${status(x.qty<=x.reorder?"Low stock":"In stock",x.qty<=x.reorder)}</td><td><button class="btn" onclick="adjust('${esc(x.id)}')">Adjust</button></td></tr>`).join(""))}`}
else if(page==="Orders"){let a=data.Orders.filter(x=>Object.values(x).join(" ").toLowerCase().includes(q.toLowerCase()));html=`<div class="top"><div><h2>Sales & Purchasing</h2><p>Manage purchase orders and sales orders.</p></div></div>${toolbar("Search orders or parties","Create order")}${table(["Order ID","Type","Customer / Supplier","Date","Amount","Status","Action"],a.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.type)}</td><td>${esc(x.party)}</td><td>${esc(x.date)}</td><td>${money(x.amount)}</td><td>${status(x.status)}</td><td><button class="btn" onclick="toggleOrder('${esc(x.id)}')">Change status</button></td></tr>`).join(""))}`}
else if(page==="HR"){let a=data.HR.filter(x=>Object.values(x).join(" ").toLowerCase().includes(q.toLowerCase()));html=`<div class="top"><div><h2>Human Resources</h2><p>Employee directory and departments.</p></div></div><div class="notice">Prototype directory only; no payroll or statutory HR processing.</div>${toolbar("Search employees","Add employee")}${table(["Employee ID","Name","Department","Role","Email","Status"],a.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.name)}</td><td>${esc(x.department)}</td><td>${esc(x.role)}</td><td>${esc(x.email)}</td><td>${status(x.status)}</td></tr>`).join(""))}`}
else if(page==="Finance"){let a=data.Finance.filter(x=>Object.values(x).join(" ").toLowerCase().includes(q.toLowerCase())),inc=data.Finance.filter(x=>x.type==="Income").reduce((a,x)=>a+x.amount,0),exp=data.Finance.filter(x=>x.type==="Expense").reduce((a,x)=>a+x.amount,0);html=`<div class="top"><div><h2>Finance</h2><p>Illustrative income and expense records.</p></div></div><div class="cards">${card("Income",money(inc),"Sample income")}${card("Expenses",money(exp),"Sample expenses")}${card("Net movement",money(inc-exp),"Income minus expenses")}</div><div class="notice">Not a general ledger. No balanced journal entries, taxes or statutory books are created.</div>${toolbar("Search transactions","Add transaction")}${table(["ID","Date","Type","Description","Amount"],a.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.description)}</td><td>${money(x.amount)}</td></tr>`).join(""))}`}
else if(page==="CRM"){let a=data.CRM.filter(x=>Object.values(x).join(" ").toLowerCase().includes(q.toLowerCase()));html=`<div class="top"><div><h2>Customer Relationship Management</h2><p>Contacts, leads and opportunities.</p></div></div>${toolbar("Search customers or contacts","Add contact")}${table(["Customer ID","Organization","Contact","Email","Stage","Estimated value","Action"],a.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.name)}</td><td>${esc(x.contact)}</td><td>${esc(x.email)}</td><td>${status(x.stage)}</td><td>${money(x.value)}</td><td><button class="btn" onclick="stage('${esc(x.id)}')">Advance stage</button></td></tr>`).join(""))}`}
else {let inv=data.Inventory.reduce((a,x)=>a+x.qty*x.cost,0),inc=data.Finance.filter(x=>x.type==="Income").reduce((a,x)=>a+x.amount,0),exp=data.Finance.filter(x=>x.type==="Expense").reduce((a,x)=>a+x.amount,0);html=`<div class="top"><div><h2>Reports & Analytics</h2><p>Summary of demo workspace data.</p></div><button class="btn primary" onclick="exportData()">Export JSON</button></div><div class="cards">${card("Inventory valuation",money(inv),"Quantity × unit cost")}${card("Orders",data.Orders.length,"Purchase and sales")}${card("Net finance movement",money(inc-exp),"Sample income minus expenses")}${card("CRM pipeline",money(data.CRM.reduce((a,x)=>a+x.value,0)),"Estimated opportunity value")}</div><div class="card"><h3>Inventory by category</h3>${Object.entries(data.Inventory.reduce((a,x)=>(a[x.category]=(a[x.category]||0)+x.qty*x.cost,a),{})).map(([k,v])=>`<p>${esc(k)} <b style="float:right">${money(v)}</b></p>`).join("")}</div><button class="btn" onclick="resetData()">Reset sample data</button>`}
$("#app").innerHTML=html;let s=$("#search");if(s)s.addEventListener("input",e=>{q=e.target.value;let p=e.target.selectionStart;render();$("#search").focus();$("#search").setSelectionRange(p,p)});let add=$("#add");if(add)add.onclick=()=>openAdd(page);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{page=b.dataset.page;q="";document.querySelectorAll("nav button").forEach(n=>n.classList.toggle("active",n===b));render()});
const schemas={Inventory:{title:"Add material",key:"Inventory",fields:[["id","Material ID","text"],["name","Description","text"],["category","Category","select","Office Supplies,IT Equipment,Consumables,Spare Parts,Other"],["qty","Opening quantity","number"],["unit","Unit","text"],["reorder","Reorder level","number"],["cost","Unit cost (₹)","number"]]},Orders:{title:"Create order",key:"Orders",fields:[["id","Order ID","text"],["type","Order type","select","Purchase Order,Sales Order"],["party","Customer / Supplier","text"],["date","Date","date"],["amount","Amount (₹)","number"],["status","Status","select","Pending,Approved"]]},HR:{title:"Add employee",key:"HR",fields:[["id","Employee ID","text"],["name","Full name","text"],["department","Department","text"],["role","Job title","text"],["email","Email","email"],["status","Status","select","Active,Inactive"]]},Finance:{title:"Add transaction",key:"Finance",fields:[["id","Transaction ID","text"],["date","Date","date"],["type","Type","select","Income,Expense"],["description","Description","text"],["amount","Amount (₹)","number"]]},CRM:{title:"Add contact",key:"CRM",fields:[["id","Customer ID","text"],["name","Organization","text"],["contact","Contact person","text"],["email","Email","email"],["stage","Stage","select","Lead,Qualified,Customer"],["value","Estimated value (₹)","number"]]}};
function openAdd(p){let s=schemas[p];$("#modalTitle").textContent=s.title;$("#fields").innerHTML=s.fields.map(([n,l,t,o])=>`<div class="field"><label>${l}</label>${t==="select"?`<select name="${n}">${o.split(",").map(v=>`<option>${v}</option>`).join("")}</select>`:`<input name="${n}" type="${t}" ${t==="number"?'min="0" step="any"':""} required>`}</div>`).join("");$("#form").dataset.key=s.key;$("#modal").classList.add("open")}
function closeModal(){$("#modal").classList.remove("open")}
$("#form").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),o={};f.forEach((v,k)=>o[k]=v);["qty","reorder","cost","amount","value"].forEach(k=>{if(k in o)o[k]=Number(o[k])});let key=e.target.dataset.key;if(data[key].some(x=>x.id===o.id)){alert("That ID already exists.");return}data[key].push(o);save();closeModal();render()};
function adjust(id){let x=data.Inventory.find(i=>i.id===id),v=prompt("Enter new counted quantity for "+x.name,x.qty);if(v===null)return;if(!Number.isFinite(Number(v))||Number(v)<0){alert("Enter a valid non-negative quantity.");return}x.qty=Number(v);save();render()}
function toggleOrder(id){let x=data.Orders.find(i=>i.id===id);x.status=x.status==="Pending"?"Approved":"Pending";save();render()}
function stage(id){let x=data.CRM.find(i=>i.id===id),s=["Lead","Qualified","Customer"];x.stage=s[(s.indexOf(x.stage)+1)%s.length];save();render()}
function exportData(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="serviceflow-erp-data.json";a.click();URL.revokeObjectURL(a.href)}
function resetData(){if(confirm("Reset sample records?")){data=JSON.parse(JSON.stringify(initial));save();render()}}
render();
</script></body></html>
